name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The generated WASM only depends on the Rust sources, so when none of
      # them changed we restore the previous output and skip the Rust build.
      - name: Cache WASM output
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: src/tools/*/wasm
          key: ${{ runner.os }}-wasm-${{ hashFiles('crates/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install Rust toolchain
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Cache wasm-pack tool downloads
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: ${{ runner.os }}-wasm-pack-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-pack-

      - name: Install wasm-pack
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Build every Rust crate to WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in crates/*/; do
            name="$(basename "$d")"
            echo "::group::wasm-pack $name"
            wasm-pack build "$d" --target bundler --out-dir "../../src/tools/$name/wasm"
            echo "::endgroup::"
          done

      - name: Install JS dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Vite app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
